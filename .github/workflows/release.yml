# Push a tag like v0.1.1 on main to release. It runs the checks, then makes the
# GitHub release with the TypeScript packages as .tgz files. Go needs nothing
# more: `go get` reads the tag. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # the packageManager version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: go vet ./... && go test -race ./...

      - name: Build the packages
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          scripts/release.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release"

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Go:

          \`\`\`bash
          go get github.com/${GITHUB_REPOSITORY}@v$VERSION
          \`\`\`

          TypeScript:

          \`\`\`bash
          npm install $base/clevix-flow-$VERSION.tgz
          \`\`\`

          \`clevix-protocol-$VERSION.tgz\` is for the engine. Apps do not need it.
          NOTES
          gh release create "v$VERSION" "$RUNNER_TEMP"/release/clevix-*.tgz \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
