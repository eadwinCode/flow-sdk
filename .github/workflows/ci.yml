name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so nothing to cache
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # The Go code the docs show. examples/go is a module of its own (the root
      # module's ./... does not reach it), built against this repo's SDK.
      - name: Build and vet the docs examples
        working-directory: examples/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build -o /dev/null ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun installs and runs the scripts, at the packageManager version in
      # package.json. Node runs the tools (tsc, vitest, tsup), as before.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # the packageManager version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Also type-checks the TypeScript code the docs show (examples/ts is a
      # workspace), so the docs can not drift from the SDK.
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The docs site fails on a dead link, and scripts/check-docs.mjs on a missing
      # code snippet or heading. Build it here so they fail the pull request, not
      # the Pages deploy after the merge.
      - run: bun run docs:build
