name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so nothing to cache
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun installs and runs the scripts, at the packageManager version in
      # package.json. Node runs the tools (tsc, vitest, tsup), as before.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # the packageManager version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # The docs site fails on a dead link. Build it here so a bad link fails the
      # pull request, not the Pages deploy after the merge.
      - run: bun run docs:build
